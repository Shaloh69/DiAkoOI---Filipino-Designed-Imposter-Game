org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is off because it does not work here.
#
# `flutter build apk --profile` failed reproducibly on Windows with
# "Could not close incremental caches in ...camera_android_camerax..." —
# the Kotlin compile daemon cannot release its .tab file handles, so the
# task fails after compiling. Surviving a clean, a fresh checkout and a
# `gradlew --stop`, it is not a stale-daemon problem.
#
# The cost is slower incremental Android builds. The benefit is that the
# A5 profiling procedure in BLOCKED.md, which opens with
# `flutter build apk --profile`, actually runs.
kotlin.incremental=false

# DiAkoOi lint configuration.
# very_good_analysis per CLAUDE.md §Conventions — swapped in from the template's
# flutter_lints at adoption (docs/adr/0002-templates.md).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated by freezed / json_serializable — not ours to lint.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
  errors:
    # A hardcoded design value outside a theme file is a bug (CLAUDE.md §Hard rules),
    # but that is enforced by the golden matrix, not the analyser.
    todo: ignore

linter:
  rules:
    # The engine is pure Dart and public-API docs land with the models in Phase 1.
    public_member_api_docs: false

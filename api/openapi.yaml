openapi: 3.1.0

# The contract is written first and is the source of truth: generate clients
# from it, never hand-edit it to match code (CLAUDE.md §Off-limits).
# JSON Schema dialect pinned explicitly to avoid validator mismatches
# (docs/06-TESTING-STRATEGY.md §6).
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: DiAkoOi API
  version: 0.2.0
  description: >-
    Feedback and word-bank delivery for DiAkoOi.


    **Nothing here is required to start or finish a game.** The app is
    offline-first, ships a complete word bank, and treats the server copy as
    an update rather than a dependency (CLAUDE.md §Hard rules). Every endpoint
    is allowed to be unreachable, and the app must degrade silently when it is
    (docs/12-HOSTING.md §2c).


    **There is no telemetry endpoint, deliberately.** v1 collects nothing —
    see docs/adr/0015-no-telemetry-in-v1.md. A documented endpoint that
    returns 501 is a contract to maintain for nothing, so it is absent rather
    than stubbed.


    **No endpoint accepts a photograph of a person.** Selfies live in device
    memory only and never leave it (01-DESIGN.md §4b). Feedback screenshots
    are a different consent model entirely — the user chose to send one — and
    are constrained by media type and size below.
  license:
    name: See LICENSE in the repository

servers:
  - url: http://localhost:3000
    description: Local development
  # The public base URL rotates on every cloudflared restart and is therefore
  # NEVER baked into a client. The app resolves it at runtime from
  # endpoint.json (docs/12-HOSTING.md §2b).
  - url: https://{tunnel}.trycloudflare.com
    description: Beta, behind a Cloudflare Quick Tunnel
    variables:
      tunnel:
        default: example
        description: >-
          Rotates on every tunnel restart. Read from endpoint.json at runtime;
          a hardcoded value here would be a dead app.

tags:
  - name: health
    description: Liveness and readiness.
  - name: feedback
    description: User-initiated bug reports and suggestions.
  - name: word-banks
    description: Content delivery. Always optional — the app ships a bundle.

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: >-
        Always 200 while the process is serving. `data.database` reports
        connectivity separately so a database outage is visible without
        making the probe itself fail.
      responses:
        '200':
          description: The service is serving requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/feedback:
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit a bug report or suggestion
      description: >-
        User-initiated and explicitly consented to. The app queues submissions
        locally when the API is unreachable and retries later, so a client may
        send a report minutes or days after it was written
        (docs/12-HOSTING.md §2c).


        An optional screenshot may be attached as base64. It is stored
        content-addressed by SHA-256 for dedup and integrity, and **encrypted
        at rest** — the hash is not the security control, the encryption is
        (01-DESIGN.md §16b). Retrieval is via a short-lived signed URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/word-banks:
    get:
      operationId: listWordBanks
      tags: [word-banks]
      summary: List available topics and the current content version
      description: >-
        The app compares `contentVersion` against its bundled copy and fetches
        only what changed. A client that never calls this still plays a
        complete game.
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: The catalogue, or an empty change set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordBankListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/word-banks/{topic}:
    get:
      operationId: getWordBank
      tags: [word-banks]
      summary: Fetch one topic's words and authored clues
      parameters:
        - name: topic
          in: path
          required: true
          description: Topic id, as listed by `GET /v1/word-banks`.
          schema:
            $ref: '#/components/schemas/TopicId'
      responses:
        '200':
          description: The topic's words.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordBankResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  parameters:
    Since:
      name: since
      in: query
      required: false
      description: >-
        Content version the client already holds. When it matches the server's
        current version the response carries an empty `topics` array rather
        than a 304, so the client always gets a body it can parse.
      schema:
        type: string
        minLength: 1
        maxLength: 64

  responses:
    ValidationError:
      description: The request body or parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    MethodNotAllowed:
      description: >-
        The path exists but not for this method. Distinguished from 404
        deliberately: a client hitting the wrong verb should not be told the
        endpoint is missing.
      headers:
        Allow:
          description: Methods this path does accept.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    PayloadTooLarge:
      description: >-
        The body exceeded the limit. Attachments are capped well below what a
        photograph of a person would need.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnsupportedMedia:
      description: Content-Type is not application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: >-
        Rate limit exceeded. Every public endpoint is limited; a residential
        host has no capacity to absorb abuse (docs/12-HOSTING.md §4).
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    DatabaseUnavailable:
      description: >-
        The database is unreachable. The app treats this exactly like being
        offline — bundled content, no error dialog (docs/12-HOSTING.md §2c).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Unhandled server fault. Never contains internal detail.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnexpectedError:
      description: Any other error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
          description: Correlation id echoed in logs.
          minLength: 1
        timestamp:
          type: string
          format: date-time

    TopicId:
      type: string
      description: Stable topic identifier, lowercase.
      pattern: '^[a-z][a-z0-9_]{1,31}$'

    HealthData:
      type: object
      additionalProperties: false
      required: [status, uptimeSeconds, database]
      properties:
        status:
          type: string
          enum: [ok]
        uptimeSeconds:
          type: number
          minimum: 0
        database:
          type: string
          description: Result of the most recent connectivity check.
          enum: [up, down, not_configured]

    HealthResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/HealthData'
        meta:
          $ref: '#/components/schemas/Meta'

    FeedbackAttachment:
      type: object
      additionalProperties: false
      required: [contentType, dataBase64]
      description: >-
        A screenshot the user deliberately attached. **Not a selfie** — those
        never leave device memory (01-DESIGN.md §4b), and the media types here
        are limited to screenshot formats for that reason.
      properties:
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        dataBase64:
          type: string
          description: >-
            Base64 of the image bytes. Capped small: a screenshot of a phone
            screen fits comfortably, a camera photograph does not.
          minLength: 1
          maxLength: 2800000
          contentEncoding: base64

    FeedbackRequest:
      type: object
      additionalProperties: false
      required: [category, message]
      properties:
        category:
          type: string
          enum: [bug, suggestion, content, other]
        message:
          type: string
          minLength: 1
          maxLength: 4000
        appVersion:
          type: string
          maxLength: 32
        # Device model only, never an identifier. Nothing here distinguishes
        # one installation from another (01-DESIGN.md §16a).
        deviceModel:
          type: string
          maxLength: 64
        contactEmail:
          type: string
          format: email
          maxLength: 254
          description: Optional. Supplied only if the user wants a reply.
        attachment:
          $ref: '#/components/schemas/FeedbackAttachment'
        # Set by the client when a queued report is finally delivered, so a
        # report written offline keeps the time it was written.
        occurredAt:
          type: string
          format: date-time

    FeedbackData:
      type: object
      additionalProperties: false
      required: [id, receivedAt]
      properties:
        id:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
        attachmentSha256:
          type: string
          description: >-
            Content address of the stored attachment. Dedup and integrity —
            not a capability, and not sufficient to retrieve it.
          pattern: '^[a-f0-9]{64}$'

    FeedbackResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/FeedbackData'
        meta:
          $ref: '#/components/schemas/Meta'

    WordBankSummary:
      type: object
      additionalProperties: false
      required: [topicId, wordCount, contentVersion]
      properties:
        topicId:
          $ref: '#/components/schemas/TopicId'
        wordCount:
          type: integer
          minimum: 0
        contentVersion:
          type: string
          minLength: 1
          maxLength: 64

    WordBankListData:
      type: object
      additionalProperties: false
      required: [contentVersion, topics]
      properties:
        contentVersion:
          type: string
          minLength: 1
          maxLength: 64
        topics:
          type: array
          items:
            $ref: '#/components/schemas/WordBankSummary'

    WordBankListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/WordBankListData'
        meta:
          $ref: '#/components/schemas/Meta'

    ClueSet:
      type: object
      additionalProperties: false
      required: [tight, standard, loose]
      description: >-
        Three authored tiers. Nothing here is algorithmically derived —
        derivation collapses at a table and produces uneven difficulty with no
        way to tune it (01-DESIGN.md §14).
      properties:
        tight:
          type: string
          minLength: 1
          maxLength: 200
        standard:
          type: string
          minLength: 1
          maxLength: 200
        loose:
          type: string
          minLength: 1
          maxLength: 200

    WordBankEntry:
      type: object
      additionalProperties: false
      required: [topicId, word, clues]
      properties:
        topicId:
          $ref: '#/components/schemas/TopicId'
        word:
          type: string
          minLength: 1
          maxLength: 80
        clues:
          $ref: '#/components/schemas/ClueSet'
        difficultyRating:
          type: integer
          minimum: 1
          maximum: 5
        region:
          type: string
          enum: [national, luzon, visayas, mindanao]

    WordBankData:
      type: object
      additionalProperties: false
      required: [topicId, contentVersion, words]
      properties:
        topicId:
          $ref: '#/components/schemas/TopicId'
        contentVersion:
          type: string
          minLength: 1
          maxLength: 64
        words:
          type: array
          items:
            $ref: '#/components/schemas/WordBankEntry'

    WordBankResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/WordBankData'
        meta:
          $ref: '#/components/schemas/Meta'

    # Documenting the error body is the cheapest way to avoid the most common
    # contract violation (docs/06-TESTING-STRATEGY.md §6).
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable identifier.
              minLength: 1
            message:
              type: string
              description: Human-readable explanation. Never contains secrets.
              minLength: 1
            details:
              type: array
              description: >-
                Field-level validation problems, when the code is
                VALIDATION_FAILED. Absent otherwise.
              items:
                type: object
                additionalProperties: false
                required: [path, message]
                properties:
                  path:
                    type: string
                    minLength: 1
                  message:
                    type: string
                    minLength: 1

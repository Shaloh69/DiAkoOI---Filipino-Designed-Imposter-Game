services:
  postgres:
    image: postgres:16-alpine
    container_name: diakooi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bound to localhost only. NEVER 0.0.0.0 — see docs/01-DESIGN.md 16c
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: diakooi-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_PORT: ${API_PORT}
    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"
    volumes:
      - attachments:/app/storage/attachments

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: diakooi-tunnel
    restart: unless-stopped
    depends_on:
      - api
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    # Exposes the PUBLIC API ONLY.
    # The admin console is Tailscale-bound and must never be tunnelled.

volumes:
  postgres-data:
  attachments:
